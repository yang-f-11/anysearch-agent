[project]
name = "anysearch-agent"
version = "0.1.0"
description = "联网搜索智能 Agent — AnySearch + LLM Hub（纯 HTTP，无 MCP SDK 依赖）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
sync = ["requests>=2.28.0"]
